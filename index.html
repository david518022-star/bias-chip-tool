<script>
// 強勢股技術面評分引擎 (共用：HTML 與 Node)
function parseSeries(txt){const m={};txt.trim().split(/\n+/).forEach(l=>{const p=l.trim().split(/[\s,\t]+/);if(p.length>=2&&/^\d{4}-\d{2}-\d{2}$/.test(p[0])){m[p[0]]={c:+p[1],v:p[2]!=null?+p[2]:0};}});return m;}
function sma(a,n,i){if(i<n-1)return null;let s=0;for(let k=i-n+1;k<=i;k++)s+=a[k];return s/n;}
function ret(a,n){const L=a.length-1;return L-n>=0?(a[L]/a[L-n]-1)*100:null;}
function clamp(x){return Math.max(0,Math.min(100,x));}
function zigzag(c,th){ // 8% 轉折
  const piv=[];let dir=0,ext=c[0],ei=0;
  for(let i=1;i<c.length;i++){
    if(dir>=0){ if(c[i]>ext){ext=c[i];ei=i;} else if(c[i]<=ext*(1-th)){ if(dir===1||piv.length===0)piv.push({i:ei,p:ext,t:'H'}); dir=-1;ext=c[i];ei=i;} if(dir===0&&c[i]<ext){} }
    else { if(c[i]<ext){ext=c[i];ei=i;} else if(c[i]>=ext*(1+th)){piv.push({i:ei,p:ext,t:'L'});dir=1;ext=c[i];ei=i;} }
  }
  return {piv,last:{i:ei,p:ext,t:dir<0?'L':'H'}};
}
function analyze(name,code,mkt,stock,idx,otc){
  const dates=Object.keys(stock).filter(d=>idx[d]&&otc[d]).sort(); // 共同日期對齊
  const c=dates.map(d=>stock[d].c),v=dates.map(d=>stock[d].v),ic=dates.map(d=>idx[d].c),oc=dates.map(d=>otc[d].c);
  const L=c.length-1,ma=n=>c.map((_,i)=>sma(c,n,i));
  const m5=ma(5),m10=ma(10),m20=ma(20),m30=ma(30),m60=ma(60);
  const chg=c.map((x,i)=>i?(x/c[i-1]-1)*100:0);
  // RS 30%
  const r20=ret(c,20),ir20=ret(ic,20),or20=ret(oc,20),r5=ret(c,5),ir5=ret(ic,5),or5=ret(oc,5);
  const bench=mkt==='TPEx'?or20:ir20;
  const rsDiff=r20-ir20; const sRS=clamp(50+rsDiff*2.5);
  // 均線多頭排列 25%
  let maPts=0;const chk=[c[L]>m5[L],m5[L]>m10[L],m10[L]>m20[L],m20[L]>(m60[L]??m30[L]),m20[L]>m20[L-5]];chk.forEach(b=>b&&(maPts+=20));
  const sMA=maPts;
  // 量價健康度 20% (含漲停處理)
  let good=0,tot=0;const av20=sma(v,20,L);
  for(let i=L-9;i<=L;i++){const avg=sma(v,20,i-1)||av20;const lim=chg[i]>=9.5;tot++;
    if(chg[i]>0&&(v[i]>=avg||lim))good++; else if(chg[i]<=0&&v[i]<avg)good++; }
  const sVol=clamp(good/tot*100);
  // 近20日創高 15%
  const hi20=Math.max(...c.slice(L-19)),lo20=Math.min(...c.slice(L-19));
  const isHigh=c[L]>=hi20;const sHigh=isHigh?100:clamp(100-(1-c[L]/hi20)*100*8);
  // 拉回控制 10%
  let peak=c[L-19],mdd=0;for(let i=L-19;i<=L;i++){peak=Math.max(peak,c[i]);mdd=Math.min(mdd,(c[i]/peak-1)*100);}
  const sPB=clamp(100+mdd*5);
  const score=+(sRS*.3+sMA*.25+sVol*.2+sHigh*.15+sPB*.1).toFixed(1);
  const rebound=(c[L]/lo20-1)*100;
  const volRatio=v[L]/av20;
  const bias=c.map((x,i)=>m5[i]?(x/m5[i]-1)*100:null);
  // zigzag 8%
  const z=zigzag(c,0.08);const allP=z.piv.concat([z.last]);
  let swingHi=null,swingLo=null;for(let k=allP.length-1;k>=0;k--){if(!swingHi&&allP[k].t==='H')swingHi=allP[k];if(swingHi&&allP[k].t==='L'&&allP[k].i<swingHi.i){swingLo=allP[k];break;}}
  if(!swingHi)swingHi={i:c.indexOf(Math.max(...c)),p:Math.max(...c)};
  const pbNow=(c[L]/swingHi.p-1)*100;
  const zones=[15,18,20,22].map(p=>({p,price:+(swingHi.p*(1-p/100)).toFixed(2)}));
  // 分類
  let type='整理/弱勢';
  if(sMA>=80&&r20>15&&c[L]>m5[L])type='主升段';else if(c[L]>m30[L]&&m30[L]>m30[L-5])type='波段趨勢股';
  const warn=[];const b=bias[L];
  if(b>=6)warn.push(`5日乖離 ${b.toFixed(2)}% ≥6%：過熱，勿追高`);else if(b>=5)warn.push(`5日乖離 ${b.toFixed(2)}% ≥5%：留意短線過熱`);
  if(c[L]<m5[L])warn.push('收盤跌破5日線：短線轉弱');
  if(type==='主升段'&&c[L]<m10[L])warn.push('主升段跌破10日線，留意結束');
  if(type!=='主升段'&&c[L]<m30[L])warn.push('收盤低於30日線：波段趨勢轉弱');
  if(volRatio>=2&&chg[L]<0)warn.push('爆量收黑：留意出貨');
  if(pbNow<=-15)warn.push(`自波段高點拉回 ${pbNow.toFixed(1)}%：已進入拉回進場觀察區`);
  return {name,code,mkt,dates,c,v,m5,m10,m30,bias,chg,score,parts:{sRS,sMA,sVol,sHigh,sPB},rsDiff,r5,r20,ir5,ir20,or5,or20,vsIdx:r20-ir20,vsOtc:r20-or20,rebound,volRatio,av20,hi20,isHigh,mdd,swingHi:{date:dates[swingHi.i],p:swingHi.p},swingLo:swingLo?{date:dates[swingLo.i],p:swingLo.p}:null,pbNow,zones,ma5:m5[L],type,warn,bias5:b,close:c[L],last:dates[L],limitUp:chg[L]>=9.5};
}
function market(idx,otc){const d=Object.keys(idx).filter(x=>otc[x]).sort();const a=d.map(x=>idx[x].c),b=d.map(x=>otc[x].c);
  const r={i5:ret(a,5),i20:ret(a,20),o5:ret(b,5),o20:ret(b,20),il:a[a.length-1],ol:b[b.length-1],last:d[d.length-1]};
  r.concl=(r.o20>r.i20&&r.o5>r.i5)?'櫃買強於大盤：中小型股資金活絡，櫃買股較具攻擊性':(r.o20<r.i20&&r.o5<r.i5)?'大盤強於櫃買：資金集中權值股，櫃買股宜挑強勢個股':'強弱分歧：短中期互有領先，宜觀察資金輪動';return r;}
if(typeof module!=='undefined')module.exports={parseSeries,analyze,market};

let RES=[];const f=(x,d=2)=>x==null?'-':(+x).toFixed(d),pc=x=>`<span class="${x>=0?'up':'down'}">${x>=0?'+':''}${f(x)}%</span>`;
function run(){const idx=parseSeries(document.getElementById('idx').value),otc=parseSeries(document.getElementById('otc').value);
RES=[...document.querySelectorAll('.box textarea.st')].map(t=>{const b=t.parentNode;return analyze(b.querySelector('.nm').value,b.querySelector('.cd').value,b.querySelector('.mk').value,parseSeries(t.value),idx,otc);}).sort((a,b)=>b.score-a.score);
const M=market(idx,otc);
document.getElementById('mkt').innerHTML=`<div class="card"><h3>大盤 vs 櫃買 對照</h3><table><tr><th></th><th>收盤</th><th>5日</th><th>20日</th></tr><tr><td>加權指數</td><td>${f(M.il)}</td><td>${pc(M.i5)}</td><td>${pc(M.i20)}</td></tr><tr><td>櫃買指數</td><td>${f(M.ol)}</td><td>${pc(M.o5)}</td><td>${pc(M.o20)}</td></tr></table><div class="warn">${M.concl}</div></div><br>`;
document.getElementById('rank').innerHTML='<div class="grid">'+RES.map((r,i)=>`<div class="card"><h3>#${i+1} ${r.name} ${r.code} <span class="tag">${r.type}</span></h3>
<div class="score">${r.score}<span class="faint"> / 100</span></div>
<div>收盤 ${f(r.close)}（${pc(r.chg[r.chg.length-1])}）${r.limitUp?'<b class="up">漲停</b>':''}｜5日線 ${f(r.ma5)}｜5日乖離 ${pc(r.bias5)}</div>
<table><tr><th>項目</th><th>分數</th></tr><tr><td>RS vs 加權 (30%)</td><td>${f(r.parts.sRS,0)}</td></tr><tr><td>均線多頭排列 (25%)</td><td>${f(r.parts.sMA,0)}</td></tr><tr><td>量價健康度 (20%)</td><td>${f(r.parts.sVol,0)}</td></tr><tr><td>近20日創高 (15%)</td><td>${f(r.parts.sHigh,0)}</td></tr><tr><td>拉回控制 (10%)</td><td>${f(r.parts.sPB,0)}</td></tr></table>
<div class="faint">反彈幅度(距20日低) ${f(r.rebound)}%｜20日最大回檔 ${f(r.mdd)}%</div>
<div>基準比較法：20日 vs大盤 ${pc(r.vsIdx)}｜vs櫃買 ${pc(r.vsOtc)}</div>
<div>流量指標法：量/20日均量 <b>${f(r.volRatio)}x</b></div>
<div>8% 拉回進場法：波段高 ${f(r.swingHi.p)}（${r.swingHi.date}），目前拉回 ${pc(r.pbNow)}<br>${r.zones.map(z=>`${z.p}%→${f(z.price)}`).join('｜')}</div>
${r.warn.map(w=>`<div class="warn">⚠ ${w}</div>`).join('')}</div>`).join('')+'</div>';
['pick','pick2'].forEach(id=>{const s=document.getElementById(id);s.innerHTML=RES.map((r,i)=>`<option value="${i}">${r.name} ${r.code}</option>`).join('');});drawChart();drawCal();}
function drawChart(){const r=RES[+document.getElementById('pick').value||0];const W=1000,H=380,P=50,n=r.c.length;const all=[...r.c,...r.m30.filter(x=>x)];const mn=Math.min(...all),mx=Math.max(...all);
const X=i=>P+i*(W-2*P)/(n-1),Y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P);const path=(a,col,w)=>`<path d="${a.map((v,i)=>v==null?'':`${a.slice(0,i).some(x=>x!=null)?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('')}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="background:#fff;border:1px solid var(--line)">`;for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;s+=`<line x1="${P}" x2="${W-P}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eee"/><text x="4" y="${Y(v)+4}" font-size="11" fill="#9aa3b5">${v.toFixed(0)}</text>`;}
for(let k=0;k<6;k++){const i=Math.round(k*(n-1)/5);s+=`<text x="${X(i)-28}" y="${H-20}" font-size="11" fill="#9aa3b5">${r.dates[i]}</text>`;}
s+=path(r.c,'#13294b',2)+path(r.m5,'#d62728',1.2)+path(r.m10,'#c9a227',1.2)+path(r.m30,'#1a9850',1.2);
r.bias.forEach((b,i)=>{if(b!=null&&Math.abs(b)>=5)s+=`<circle cx="${X(i)}" cy="${Y(r.c[i])}" r="5" fill="${b>0?'#d62728':'#1a9850'}"><title>${r.dates[i]} 乖離 ${b.toFixed(2)}%</title></circle>`;});
s+=`<text x="${P}" y="18" font-size="12"><tspan fill="#13294b">■收盤</tspan> <tspan fill="#d62728">■MA5</tspan> <tspan fill="#c9a227">■MA10</tspan> <tspan fill="#1a9850">■MA30</tspan> ●|乖離|≥5%</text></svg>`;
document.getElementById('chart').innerHTML=s;
document.getElementById('biaslist').innerHTML='<h3>乖離率歷史（vs MA5）</h3><table><tr><th>日期</th><th>收盤</th><th>漲跌</th><th>MA5</th><th>乖離</th><th>量</th></tr>'+r.dates.map((d,i)=>[d,i]).reverse().filter(([d,i])=>r.m5[i]).map(([d,i])=>`<tr><td>${d}</td><td>${f(r.c[i])}</td><td>${pc(r.chg[i])}</td><td>${f(r.m5[i])}</td><td>${pc(r.bias[i])}${r.bias[i]>=6?' ⚠⚠':r.bias[i]>=5?' ⚠':''}</td><td>${r.v[i].toLocaleString()}</td></tr>`).join('')+'</table>';}
function drawCal(){const r=RES[+document.getElementById('pick2').value||0];const wk={};r.dates.forEach((d,i)=>{if(!i)return;const dt=new Date(d+'T00:00:00');const mon=new Date(dt);mon.setDate(dt.getDate()-(dt.getDay()+6)%7);const k=mon.toISOString().slice(0,10);(wk[k]=wk[k]||{})[dt.getDay()]=r.chg[i];});
document.getElementById('cal').innerHTML='<table class="wk"><tr><th>週（週一）</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>上漲天數</th></tr>'+Object.keys(wk).sort().reverse().map(k=>{const w=wk[k];let up=0,cnt=0;const cells=[1,2,3,4,5].map(d=>{if(w[d]==null)return '<td class="faint">休</td>';cnt++;if(w[d]>0)up++;return `<td class="${w[d]>0?'u':w[d]<0?'d':''}">${w[d]>0?'+':''}${w[d].toFixed(2)}%</td>`;}).join('');return `<tr><td>${k}</td>${cells}<td>${up}/${cnt}</td></tr>`;}).join('')+'</table>';}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.tab').forEach(e=>e.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.t).classList.add('on');});
document.getElementById('run').onclick=run;document.getElementById('pick').onchange=drawChart;document.getElementById('pick2').onchange=drawCal;run();
</script></body></html>
